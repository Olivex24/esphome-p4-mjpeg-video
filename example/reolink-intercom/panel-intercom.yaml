# Waveshare ESP32-P4-WIFI6-Touch-LCD-X 10.1": live doorbell video + "Listen" + "Hold to talk" with a Reolink doorbell.
# Needs intercom_server.py running on your server and the go2rtc streams from go2rtc.yaml.
# Set `server` to that machine's LAN address (keep it on your local network).
substitutions:
  server: "SERVER_LAN_IP"

esphome:
  name: p4-intercom
  min_version: 2026.9.0
  includes:
    - intercom_udp.h
  on_boot:
    priority: -100
    then:
      - lambda: 'id(video).set_image(id(img_video));'

esp32:
  variant: esp32p4
  cpu_frequency: 360MHz
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 40MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

globals:
  - id: talking
    type: bool
    initial_value: 'false'
  - id: listening
    type: bool
    initial_value: 'false'

i2c:
  - id: bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# ---------------------------------------------------------------- audio (ES8311 speaker, ES7210 microphones)
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: dac
    i2c_id: bus
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false

audio_adc:
  - platform: es7210
    id: adc
    i2c_id: bus
    address: 0x40
    sample_rate: 16000
    bits_per_sample: 16bit
    mic_gain: 36db

switch:
  - platform: gpio
    id: amplifier          # speaker amplifier enable
    internal: true
    pin: GPIO53
    restore_mode: ALWAYS_OFF

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    on_data:
      - lambda: 'if (id(talking)) intercom_udp_send("${server}", 5004, x.data(), x.size());'

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

media_player:
  - platform: speaker
    id: player
    announcement_pipeline:
      speaker: spk
      format: WAV
      sample_rate: 16000
      num_channels: 1
    on_announcement:
      - switch.turn_on: amplifier
    on_idle:
      - switch.turn_off: amplifier

script:
  - id: listen_start
    then:
      - lambda: 'id(listening) = true;'
      - switch.turn_on: amplifier
      - media_player.volume_set:
          id: player
          volume: 0.7
      - media_player.play_media:
          id: player
          media_url: "http://${server}:8088/listen.wav"
          announcement: true
  - id: listen_stop
    then:
      - lambda: 'id(listening) = false;'
      - media_player.stop: player

# ---------------------------------------------------------------- display + video
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-P4-NANO-10.1
    reset_pin: GPIO27
    dimensions: {width: 800, height: 1280}
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: ts_touch
    display: my_display
    i2c_id: bus

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

external_components:
  - source:
      type: git
      url: https://github.com/Olivex24/esphome-p4-mjpeg-video
    components: [mjpeg_video]

mjpeg_video:
  id: video
  width: 1280
  height: 720
  display: my_display
  rotation: 270

lvgl:
  displays: my_display
  touchscreens: ts_touch
  rotation: 270
  pages:
    - id: main_page
      widgets:
        - button:
            align: CENTER
            width: 300
            height: 100
            widgets:
              - label:
                  align: CENTER
                  text: "Doorbell"
            on_click:
              - lvgl.widget.show: door_layer
              - lambda: |-
                  // smaller than full screen so the buttons below stay visible (they are not covered by video)
                  id(video).set_rect(0, 40, 1280, 612);
                  id(video).start("http://${server}:8088/live.mjpeg?src=doorbell_listen");
        # full-screen opaque layer, a direct child of the page (see the component README)
        - obj:
            id: door_layer
            x: 0
            y: 0
            width: 1280
            height: 800
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x000000
            bg_opa: COVER
            hidden: true
            on_click:
              - lvgl.widget.hide: door_layer
              - lambda: 'id(video).stop(); id(talking) = false;'
              - microphone.stop_capture: mic
              - script.execute: listen_stop
            widgets:
              - image:
                  id: img_video
                  src: placeholder
                  align: CENTER
                  clickable: false
              - label:
                  x: 24
                  y: 8
                  text: "Doorbell - touch the picture to close"
                  text_color: 0xFFFFFF
              - button:
                  x: 240
                  y: 670
                  width: 360
                  height: 96
                  radius: 48
                  widgets:
                    - label:
                        align: CENTER
                        text: "Listen"
                  on_click:
                    - if:
                        condition:
                          lambda: 'return id(listening);'
                        then:
                          - script.execute: listen_stop
                        else:
                          - script.execute: listen_start
              - button:
                  x: 680
                  y: 670
                  width: 360
                  height: 96
                  radius: 48
                  widgets:
                    - label:
                        align: CENTER
                        text: "Hold to talk"
                  on_press:
                    # the doorbell speaker and our speaker would echo: mute ours while talking
                    - media_player.stop: player
                    - lambda: 'id(talking) = true;'
                    - delay: 150ms
                    - microphone.capture: mic
                  on_release:
                    - lambda: 'id(talking) = false;'
                    - microphone.stop_capture: mic
                    - if:
                        condition:
                          lambda: 'return id(listening);'
                        then:
                          - script.execute: listen_start

image:
  - id: placeholder
    file: mdi:doorbell-video
    type: BINARY
    resize: 64x64
